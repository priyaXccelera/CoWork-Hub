spring.application.name=CoWork Hub

server.port=20330
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://localhost:5432/gen_4d326c90fe72
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed exclusively by versioned Flyway migrations (see src/main/resources/db/migration).
# Hibernate only validates that the entity mappings match the migrated schema; it never alters it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline

# Sized to comfortably support concurrent booking traffic (pessimistic row locks on Space during
# booking creation hold a connection for the duration of the transaction, so the pool needs
# headroom beyond the expected number of simultaneous booking requests).
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# Secret: must be supplied via the ADMIN_API_KEY environment variable in any real deployment.
# The value below is only a placeholder for local/dev use and is NOT a production secret.
admin.api-key=${ADMIN_API_KEY:local-dev-admin-key-change-me}

# Comma-separated list of allowed browser origins for CORS. Override via APP_CORS_ALLOWED_ORIGINS
# in any environment where the API is called from a browser-based frontend.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
