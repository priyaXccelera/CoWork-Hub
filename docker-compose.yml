services:
  postgres:
    image: postgres:16-alpine
    container_name: cowork-hub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gen_4d326c90fe72}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cowork_hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  cowork_hub_postgres_data:
